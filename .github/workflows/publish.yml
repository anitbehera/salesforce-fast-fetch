name: Publish VS Code Extension

on:
  push:
    tags:
      - 'v*'  # runs only when pushing tags like v1.2.3

permissions:
  contents: write   # needed to create GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install extension dependencies
      - name: Install root dependencies
        run: npm ci

      # Generate Conventional Commit changelog
      - name: Generate Changelog
        uses: orhun/git-cliff-action@v2
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md

      # Commit Changelog
      - name: Commit Changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update changelog for ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push

      # Install webview dependencies
      - name: Install webview dependencies
        working-directory: webview-ui
        run: npm ci

      # Install vsce + ovsx CLI
      - run: npm install -g @vscode/vsce ovsx

      # Build the webview UI
      - name: Build Webview
        run: npm run build:webview

      # Package the extension
      - name: Package Extension
        run: vsce package

      # Publish to VS Code Marketplace
      - name: Publish to VS Code Marketplace
        run: vsce publish -p ${{ secrets.VSCE_TOKEN }}

      # Publish to Open VSX
      - name: Publish to Open VSX
        run: ovsx publish -p ${{ secrets.OVSX_TOKEN }}

      # Create GitHub Release with auto-generated notes + attach VSIX
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.vsix"
