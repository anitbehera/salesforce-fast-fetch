[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}## {{ version }} - {{ timestamp | date("%Y-%m-%d") }}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7) }})
{% endfor %}
{% endfor %}
"""

[git]
conventional_commits = true
filter_unconventional = true

[git.commit_parsers]
# Group "feat" commits under Features
"^feat" = { group = "Features" }
# Group "fix" commits under Bug Fixes
"^fix" = { group = "Bug Fixes" }
# Optional: group docs, chore, refactor, etc.
"^docs" = { group = "Documentation" }
"^chore" = { group = "Chores" }
"^refactor" = { group = "Refactoring" }
