name: Release & Deploy Extension

on:
  push:
    branches:
      - main

permissions:
  contents: write       # allow creating tags and releases
  pull-requests: write  # allow creating PRs

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: google-github-actions/release-please-action@v4
        with:
          release-type: node
          package-name: vscode-extension
          # ensures package.json, package-lock.json, and CHANGELOG.md get updated
          changelog-types: |
            [
              {"type":"feat","section":"Features","hidden":false},
              {"type":"fix","section":"Bug Fixes","hidden":false},
              {"type":"chore","section":"Miscellaneous","hidden":true}
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Install vsce globally
      - run: npm install -g @vscode/vsce

      # Build/package extension
      - name: Package Extension
        run: vsce package

      # Publish to the VS Code Marketplace
      - name: Publish Extension
        run: vsce publish -p ${{ secrets.VSCE_TOKEN }}

      # Upload packaged .vsix to GitHub Release
      - name: Upload VSIX to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
